<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- gocode mark: a terminal prompt ">_" on a graphite glass tile.
       Paths only (no text), so it renders the same everywhere and stays
       legible at 16px. Colors follow the site tokens in src/app.css. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6b26b"/>
      <stop offset="1" stop-color="#e2792f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <path d="M17 20.5 29.5 32 17 43.5" fill="none" stroke="url(#ember)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="33" y="38.5" width="15" height="6.5" rx="3.25" fill="#f4efe9"/>
</svg>
