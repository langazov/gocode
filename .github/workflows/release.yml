name: release

# Cross-compiles for macOS, Linux and Windows and publishes a GitHub Release
# with checksums.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The dispatch input builds the same artifacts without tagging, for a dry run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binaries (no tag is created)"
        required: false
        type: string
        default: "0.0.0-dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            name: macos-arm64
          - goos: darwin
            goarch: amd64
            name: macos-x64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: linux
            goarch: amd64
            name: linux-x64
          - goos: windows
            goarch: amd64
            name: windows-x64
            extension: .exe
          - goos: windows
            goarch: arm64
            name: windows-arm64
            extension: .exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/tags/v0.1.0 -> 0.1.0
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # No cgo anywhere: the SQLite driver is modernc (pure Go), which is
          # what makes cross-compiling from one runner possible at all.
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          pkg="github.com/anomalyco/opencode-go/internal/installation"
          mkdir -p dist
          go build \
            -trimpath \
            -buildmode=exe \
            -ldflags "-s -w -X ${pkg}.Version=${version} -X ${pkg}.Channel=release" \
            -o "dist/opencode${{ matrix.extension }}" \
            ./cmd/opencode

      - name: Package
        working-directory: dist
        run: |
          set -euo pipefail
          name="opencode-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          binary="opencode${{ matrix.extension }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -9 "${name}.zip" "$binary"
            archive="${name}.zip"
          else
            # Reproducible-ish tarball: fixed owner and sorted entries so the
            # same input produces the same bytes.
            tar --sort=name --owner=0 --group=0 --numeric-owner \
                -czf "${name}.tar.gz" opencode
            archive="${name}.tar.gz"
          fi

          # Ship the bare executable next to the archive as well, so a download
          # is directly runnable with no unpacking step. The archive keeps the
          # plain `opencode` name inside it; this copy carries the platform in
          # its filename because release assets share one flat namespace.
          cp "$binary" "${name}${{ matrix.extension }}"

          sha256sum "$archive" "${name}${{ matrix.extension }}" > "${name}.sha256"
          ls -lh "$archive" "${name}${{ matrix.extension }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-${{ matrix.name }}
          path: |
            dist/opencode-*
          # The build output itself must not be uploaded under its bare name;
          # only the versioned copies above are release assets.
          if-no-files-found: error
          retention-days: 7

  smoke:
    # A cross-compiled binary that does not start is worse than no release.
    # Each native runner runs the artifact it will actually ship.
    name: smoke (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runs-on: macos-latest
          - name: linux-x64
            runs-on: ubuntu-latest
          - name: windows-x64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-${{ matrix.name }}
          path: dist

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Catches a truncated upload or a mismatched artifact before anything
          # is published. macOS runners have `shasum` but not GNU `sha256sum`;
          # Git Bash on Windows and Ubuntu have the latter.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi

      - name: Unpack and run
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          run() {
            local binary="$1" label="$2"
            chmod +x "$binary" 2>/dev/null || true
            local reported
            reported="$("$binary" --version)"
            echo "$label version: $reported"
            # A release build must not report the development version.
            if [ "$reported" = "local" ]; then
              echo "::error::$label reports 'local'; the version ldflag did not apply"
              exit 1
            fi
            "$binary" --help > /dev/null
          }

          # 1. The executable shipped as a bare release asset.
          if ls opencode-*.exe >/dev/null 2>&1; then
            run "./$(ls opencode-*.exe | head -1)" "bare binary"
          else
            run "./$(ls opencode-* | grep -vE '\.(tar\.gz|zip|sha256)$' | head -1)" "bare binary"
          fi

          # 2. The same executable as unpacked from the archive.
          mkdir -p unpacked && cd unpacked
          if ls ../*.zip >/dev/null 2>&1; then
            unzip -o ../*.zip
            run "./opencode.exe" "archive"
          else
            tar -xzf ../*.tar.gz
            run "./opencode" "archive"
          fi

  release:
    name: publish release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Creating the release is the only write this workflow needs.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          echo "### Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body: |
            A single self-contained binary — no runtime to install.

            Every platform ships twice: a **bare executable** you can download
            and run as-is, and a **`.tar.gz`/`.zip` archive** of the same build.
            Use whichever suits you — the contents are identical.

            | Platform | Bare binary | Archive |
            |---|---|---|
            | macOS Apple silicon | `opencode-*-macos-arm64` | `.tar.gz` |
            | macOS Intel | `opencode-*-macos-x64` | `.tar.gz` |
            | Linux x86_64 | `opencode-*-linux-x64` | `.tar.gz` |
            | Linux arm64 | `opencode-*-linux-arm64` | `.tar.gz` |
            | Windows x64 | `opencode-*-windows-x64.exe` | `.zip` |
            | Windows arm64 | `opencode-*-windows-arm64.exe` | `.zip` |

            ## Install

            **macOS / Linux** — straight from the bare binary:
            ```sh
            chmod +x opencode-*-<platform>
            sudo mv opencode-*-<platform> /usr/local/bin/opencode
            ```

            Or from the archive:
            ```sh
            tar -xzf opencode-*-<platform>.tar.gz
            chmod +x opencode
            sudo mv opencode /usr/local/bin/
            ```

            **Windows** — rename `opencode-*-windows-x64.exe` to `opencode.exe`
            and put it on your `PATH` (or unzip the archive, which already
            contains it under that name).

            Verify a download against `SHA256SUMS`:
            ```sh
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            On macOS the binaries are unsigned, so Gatekeeper will quarantine
            them on first run:
            ```sh
            xattr -d com.apple.quarantine opencode
            ```
