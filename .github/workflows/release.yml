name: release

# Cross-compiles for macOS, Linux and Windows and publishes a GitHub Release
# with checksums.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The dispatch input builds the same artifacts without tagging, for a dry run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binaries (no tag is created)"
        required: false
        type: string
        default: "0.0.0-dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            name: macos-arm64
          - goos: darwin
            goarch: amd64
            name: macos-x64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: linux
            goarch: amd64
            name: linux-x64
          - goos: windows
            goarch: amd64
            name: windows-x64
            extension: .exe
          - goos: windows
            goarch: arm64
            name: windows-arm64
            extension: .exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/tags/v0.1.0 -> 0.1.0
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # No cgo anywhere: the SQLite driver is modernc (pure Go), which is
          # what makes cross-compiling from one runner possible at all.
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          pkg="github.com/langazov/gocode-go/internal/installation"
          ext="${{ matrix.extension }}"
          mkdir -p dist/rag-plugin

          go build \
            -trimpath \
            -buildmode=exe \
            -ldflags "-s -w -X ${pkg}.Version=${version} -X ${pkg}.Channel=release" \
            -o "dist/gocode${ext}" \
            ./cmd/gocode

          # The markdown language server. gocode's built-in registry starts it
          # for .md files when it is on PATH, and any LSP-speaking editor can
          # use it directly, so it ships alongside rather than inside.
          go build \
            -trimpath \
            -buildmode=exe \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/mdlsp${ext}" \
            ./cmd/mdlsp

          # The RAG plugin is a process plugin: a directory holding the binary
          # and its manifest, which is the shape the plugin loader resolves.
          # Shipping the binary bare would leave it unloadable.
          go build \
            -trimpath \
            -buildmode=exe \
            -ldflags "-s -w" \
            -o "dist/rag-plugin/rag-plugin${ext}" \
            ./cmd/rag-plugin
          cp cmd/rag-plugin/gocode-plugin.json dist/rag-plugin/

      - name: Package
        working-directory: dist
        run: |
          set -euo pipefail
          name="gocode-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          binary="gocode${{ matrix.extension }}"
          ext="${{ matrix.extension }}"

          # Everything the Homebrew formula installs. gocode stays first and
          # keeps its plain name at the archive root, so the documented
          # "unpack, then mv gocode" path is unchanged by the additions. An
          # array rather than a word-split string: rag-plugin is a directory,
          # and one stray space in a name would silently drop a member.
          contents=( "gocode${ext}" "mdlsp${ext}" "rag-plugin" )

          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -9 -r "${name}.zip" "${contents[@]}"
            archive="${name}.zip"
          else
            # Reproducible-ish tarball: fixed owner and sorted entries so the
            # same input produces the same bytes.
            tar --sort=name --owner=0 --group=0 --numeric-owner \
                -czf "${name}.tar.gz" "${contents[@]}"
            archive="${name}.tar.gz"
          fi

          # Ship the bare executable next to the archive as well, so a download
          # is directly runnable with no unpacking step. The archive keeps the
          # plain `gocode` name inside it; this copy carries the platform in
          # its filename because release assets share one flat namespace.
          cp "$binary" "${name}${{ matrix.extension }}"

          sha256sum "$archive" "${name}${{ matrix.extension }}" > "${name}.sha256"
          ls -lh "$archive" "${name}${{ matrix.extension }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gocode-${{ matrix.name }}
          path: |
            dist/gocode-*
          # The build output itself must not be uploaded under its bare name;
          # only the versioned copies above are release assets.
          if-no-files-found: error
          retention-days: 7

  smoke:
    # A cross-compiled binary that does not start is worse than no release.
    # Each native runner runs the artifact it will actually ship.
    name: smoke (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runs-on: macos-latest
          - name: linux-x64
            runs-on: ubuntu-latest
          - name: windows-x64
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gocode-${{ matrix.name }}
          path: dist

      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Catches a truncated upload or a mismatched artifact before anything
          # is published. macOS runners have `shasum` but not GNU `sha256sum`;
          # Git Bash on Windows and Ubuntu have the latter.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c ./*.sha256
          else
            shasum -a 256 -c ./*.sha256
          fi

      - name: Unpack and run
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          run() {
            local binary="$1" label="$2"
            chmod +x "$binary" 2>/dev/null || true
            local reported
            reported="$("$binary" --version)"
            echo "$label version: $reported"
            # A release build must not report the development version.
            if [ "$reported" = "local" ]; then
              echo "::error::$label reports 'local'; the version ldflag did not apply"
              exit 1
            fi
            "$binary" --help > /dev/null
          }

          # 1. The executable shipped as a bare release asset.
          if ls gocode-*.exe >/dev/null 2>&1; then
            run "./$(ls gocode-*.exe | head -1)" "bare binary"
          else
            run "./$(ls gocode-* | grep -vE '\.(tar\.gz|zip|sha256)$' | head -1)" "bare binary"
          fi

          # 2. The same executable as unpacked from the archive.
          mkdir -p unpacked && cd unpacked
          if ls ../*.zip >/dev/null 2>&1; then
            unzip -o ../*.zip
            run "./gocode.exe" "archive"
            ext=".exe"
          else
            tar -xzf ../*.tar.gz
            run "./gocode" "archive"
            ext=""
          fi

          # 3. The two binaries the Homebrew formula installs alongside gocode.
          # A formula that references a missing file fails on the user's
          # machine, after the release is already public.
          chmod +x "./mdlsp${ext}" "./rag-plugin/rag-plugin${ext}" 2>/dev/null || true

          echo "mdlsp version: $(./mdlsp${ext} --version)"

          test -f ./rag-plugin/gocode-plugin.json \
            || { echo "::error::rag-plugin/gocode-plugin.json is missing; the plugin cannot load without its manifest"; exit 1; }

          # rag-plugin speaks the plugin protocol on stdin and has no --version.
          # Empty stdin is a clean handshake-free start: it must reach EOF and
          # exit 0 rather than crash on a missing dependency.
          printf '' | "./rag-plugin/rag-plugin${ext}" \
            || { echo "::error::rag-plugin did not start cleanly"; exit 1; }
          echo "rag-plugin: starts and exits cleanly"

  release:
    name: publish release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Creating the release is the only write this workflow needs.
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          echo "### Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body: |
            A single self-contained binary — no runtime to install.

            Every platform ships twice: a **bare executable** you can download
            and run as-is, and a **`.tar.gz`/`.zip` archive** of the same build.
            The archive also carries the two optional extras:

            | In the archive | What it is |
            |---|---|
            | `gocode` | the agent |
            | `mdlsp` | markdown language server — gocode starts it for `.md` files, and any LSP-speaking editor can use it directly |
            | `rag-plugin/` | semantic code search plugin (`rag_index`, `rag_search`), binary plus its manifest |

            Only `gocode` is needed; unpack and move it as before if that is all
            you want. `brew install` wires up all three.

            | Platform | Bare binary | Archive |
            |---|---|---|
            | macOS Apple silicon | `gocode-*-macos-arm64` | `.tar.gz` |
            | macOS Intel | `gocode-*-macos-x64` | `.tar.gz` |
            | Linux x86_64 | `gocode-*-linux-x64` | `.tar.gz` |
            | Linux arm64 | `gocode-*-linux-arm64` | `.tar.gz` |
            | Windows x64 | `gocode-*-windows-x64.exe` | `.zip` |
            | Windows arm64 | `gocode-*-windows-arm64.exe` | `.zip` |

            ## Install

            **Homebrew** (macOS / Linux) — installs gocode, mdlsp and
            rag-plugin, and wires the last two into `~/.config/gocode`:
            ```sh
            brew install langazov/tap/gocode
            ```

            **macOS / Linux** — straight from the bare binary:
            ```sh
            chmod +x gocode-*-<platform>
            sudo mv gocode-*-<platform> /usr/local/bin/gocode
            ```

            Or from the archive:
            ```sh
            tar -xzf gocode-*-<platform>.tar.gz
            chmod +x gocode
            sudo mv gocode /usr/local/bin/
            ```

            **Windows** — rename `gocode-*-windows-x64.exe` to `gocode.exe`
            and put it on your `PATH` (or unzip the archive, which already
            contains it under that name).

            Verify a download against `SHA256SUMS`:
            ```sh
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            On macOS the binaries are unsigned, so Gatekeeper will quarantine
            them on first run:
            ```sh
            xattr -d com.apple.quarantine gocode
            ```

  homebrew:
    name: update homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out gocode
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check out the tap
        id: tap
        env:
          # GITHUB_TOKEN is scoped to this repository, so pushing to the tap
          # needs its own credential: a deploy key added to
          # langazov/homebrew-tap (write access, that repo only — narrower
          # than a personal-access-token, which would reach every repo the
          # account owns). The job no-ops instead of failing when it is
          # absent, so a release still publishes on a fork or before the
          # secret is configured.
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; skipping tap update"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_deploy_key
          chmod 600 ~/.ssh/tap_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # GITHUB_ENV only takes effect starting with the *next* step, so it
          # must also be exported here for this step's own `git clone` to
          # pick it up.
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy_key -o IdentitiesOnly=yes"
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >> "$GITHUB_ENV"
          git clone --depth 1 git@github.com:langazov/homebrew-tap.git tap
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Render and commit the formula
        if: steps.tap.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # SHA256SUMS is assembled by the release job from every matrix leg,
          # so it is the one place that already has each archive's checksum.
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir .

          script/brew-formula.sh "$version" SHA256SUMS tap/Formula/gocode.rb

          cd tap
          if git diff --quiet -- Formula/gocode.rb; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gocode.rb
          git commit -m "gocode ${version}"
          git push
